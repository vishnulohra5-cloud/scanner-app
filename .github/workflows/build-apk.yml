name: Build Android APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract and Locate Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d extracted_project
            if [ -d "extracted_project/scanner-all-in-one" ]; then
              mv extracted_project/scanner-all-in-one/* .
            else
              shopt -s dotglob
              mv extracted_project/* .
            fi
            rm -rf extracted_project
            rm "$ZIP_FILE"
          fi
          echo "Listing directory contents:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Find Gradle Wrapper and Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            echo "Found gradlew in $PROJECT_DIR"
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Error: gradlew not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-All-In-One-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
