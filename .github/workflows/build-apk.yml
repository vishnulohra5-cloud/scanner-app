name: Build Android APK from Zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Extract Project Zip
        run: |
          # यहाँ अपनी ज़िप फाइल का डायरेक्ट डाउनलोड लिंक या रिपॉजिटरी की ज़िप डालें
          curl -L -o project.zip "https://github.com/vishnuhofra5-cloud/scanner-app/raw/main/scanner---all-in-one.zip"
          unzip -q project.zip -d extracted_project
          # फाइलों को सही रूट फोल्डर में लाएं
          cp -r extracted_project/* ./ || true
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || echo "gradlew not found yet"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scanner-All-In-One-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
